title: 21 CFR § 150.140 — Fruit jelly
publisher: U.S. Food and Drug Administration (text via Cornell LII)
url: https://www.law.cornell.edu/cfr/text/21/150.140
verified: "2026-08-25"
note: >-
  U.S. standard of identity for jelly as a jelled food from filtered or strained
  fruit juice; finished soluble solids not less than 65 percent.
