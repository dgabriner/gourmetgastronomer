id: "gg:source:cfr-21-133-113-cheddar"
kind: standard
title: 21 CFR § 133.113 — Cheddar cheese
publisher: U.S. Food and Drug Administration (text via Cornell LII)
url: https://www.law.cornell.edu/cfr/text/21/133.113
verified: "2026-08-25"
note: >-
  Example standardized cheese: culture, clotting enzymes, cutting/stirring/heating
  to separate whey, salting and pressing. If dairy ingredients are not pasteurized,
  the cheese is cured at not less than 35 °F for at least 60 days.
